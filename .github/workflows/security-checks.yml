# Security checks on every push and pull request to Main-Dashboard, and weekly (24 Nov 2026, adviser's reminder:
# "automate these security checks through GitHub Actions"). All free for a public repository.
#
#   secrets       Gitleaks over the whole git history. Reviewed non-secrets are listed in .gitleaks.toml and
#                 .gitleaksignore; anything new fails the run.
#   dependencies  npm audit (backend, dashboard) and pip-audit (Python jobs) against the lock/requirements files.
#                 Fails on a high or critical advisory in what the apps actually ship (--omit=dev).
#   semgrep       Semgrep's free default rules. Every finding goes to the Security tab; the run fails only on an
#                 ERROR-level finding in the code users reach (Back-End/src, the dashboard, the desktop app).
#   codeql        GitHub CodeQL for JavaScript/TypeScript and Python; results in the Security tab.
#
# Nothing here reads the database or any repository secret, and nothing scans the live site: the adviser asked that
# aggressive scans never run against production. Actions are pinned to exact commits (Semgrep review, 24 Nov 2026);
# the comment beside each is the release it came from.
name: Security checks

on:
  push:
    branches: [Main-Dashboard]
  pull_request:
    branches: [Main-Dashboard]
  schedule:
    # Mondays 01:37 UTC (09:37 Manila): new advisories appear even when the code has not changed.
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install Gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan the full history
        # --redact: a found secret is never printed into the public Actions log.
        run: ./gitleaks git . --redact --no-banner --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --exit-code 1

  dependencies:
    name: Dependencies (npm audit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: npm audit (backend)
        working-directory: Back-End
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dashboard)
        if: ${{ !cancelled() }}
        working-directory: Front-End-Dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: pip-audit (Python jobs)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet "pip-audit==2.10.1"
          pip-audit -r smartflow_scripts/requirements.txt --progress-spinner off
          pip-audit -r smartflow_scripts/requirements-ml.txt --progress-spinner off

  semgrep:
    name: Code patterns (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "semgrep==1.186.0"
      - name: All findings to the Security tab
        run: >
          semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif
          --exclude "_archive*" --exclude graphify-out --exclude _work
          Back-End/src Front-End-Dashboard/app Front-End-Dashboard/components Front-End-Dashboard/lib
          Front-End-Dashboard/electron smartflow_scripts All_Scripts .github
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on ERROR-level findings in the code users reach
        run: >
          semgrep scan --config p/default --metrics=off --severity ERROR --error
          Back-End/src Front-End-Dashboard/app Front-End-Dashboard/components Front-End-Dashboard/lib
          Front-End-Dashboard/electron

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/graphify-out/**"
              - "**/_archive*/**"
              - "_work/**"
              - "Front-End-Dashboard/out/**"
              - "Front-End-Dashboard/release/**"
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          category: "/language:${{ matrix.language }}"
