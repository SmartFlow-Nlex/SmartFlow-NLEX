# The hourly congestion refresh for the Live Map and the congestion graph, on GitHub's runners so the map stays fresh
# whether or not any laptop is on. Same trainer and flags as the laptop task "SmartFlow congestion refresh":
# trains and tests XGBoost and the GRU on the live Waze feed plus the 2022-2026 history (--with-history, the user's
# choice 16 Nov 2026; the exit-hour benchmark stays built from the live weeks), scores the dual-path LSTM family
# (restored from the cache the weekly batch saves; part 4 fits it on the live weeks plus the history, see weekly_retrain.py), publishes the
# champion, and writes one audit entry. Since 17 Nov 2026 the labels are expressway jams only (the live map's rule;
# train_congestion_horizon.py MAINLINE), not every jam Waze tagged to an exit. It steps aside while the weekly
# batch is training (--skip-if-batch-running), and an overlapping run is queued, never run twice at once.
#
# GitHub may start a scheduled run some minutes late under load; the map's base time records the hour actually used.
name: Congestion refresh (hourly)

on:
  schedule:
    # Minute 37, not 2 (17 Nov 2026, system audit): GitHub delays and drops scheduled runs most at the start of the
    # hour, and at :02 the "hourly" refresh actually ran 3-5 times a day (12-16 Nov), leaving the map 6-8 h old.
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: congestion-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # The only machine allowed to publish the congestion map (11 Nov 2026).
  CONGESTION_PUBLISHER: "1"
  TF_CPP_MIN_LOG_LEVEL: "3"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smartflow_scripts/requirements-ml.txt
      - name: Install packages
        run: pip install numpy==2.4.3 pandas==2.3.3 scikit-learn==1.8.0 statsmodels==0.14.6 xgboost==3.4.1 tensorflow==2.21.0 keras==3.15.1 psycopg2-binary==2.9.12
      - name: Settings from secrets
        env: { DB_HOST: "${{ secrets.DB_HOST }}", DB_PORT: "${{ secrets.DB_PORT }}", DB_NAME: "${{ secrets.DB_NAME }}", DB_USER: "${{ secrets.DB_USER }}", DB_PASSWORD: "${{ secrets.DB_PASSWORD }}" }
        run: bash .github/scripts/write_env.sh
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            smartflow_scripts/_work/cache
            All_Scripts/Predictive_Modeling/dualpath_models
          key: ml-state-none
          restore-keys: ml-state-
      - name: Train, test and publish
        working-directory: All_Scripts/Predictive_Modeling
        run: python -u train_congestion_horizon.py --fast --no-qrf --skip-if-batch-running --severe-weight 1.5 --with-history
      # Keep the raw Waze snapshots to 7 days (21 Nov 2026 audit, H3): ~100 MB a day accumulated with nothing deleting
      # it, the size that preceded the 23 Oct database outage. The parsed jams (silver.fact_waze_jams) are untouched.
      # Runs even when training was skipped or failed; a run with nothing to delete is two quick queries.
      - name: Prune raw Waze snapshots older than 7 days
        if: ${{ !cancelled() }}
        working-directory: smartflow_scripts/1_data_loading/waze
        timeout-minutes: 15
        run: python -u prune_waze_raw.py --keep-days 7
